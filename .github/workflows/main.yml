name: .NET CI

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: StangaNet/.github/.github/workflows/dotnet-lib.yml@main
    with:
      library-name: 'StangaNetLib.Observability'
      artifact-name: 'stanganetlib-observability-nuget'
    secrets: inherit
